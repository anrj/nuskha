[project]
name = "nuskha-engine"
version = "0.1.0"
description = "Nuskha engine: Georgian-aware document RAG (ingest, hybrid search, cited answers)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "striprtf>=0.0.29",
  "httpx>=0.27",
  "posthog>=3.7",
  "boto3>=1.35",
  "xlrd>=2.0.2",
  "olefile>=0.47",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
