# Render blueprint for the engine (web app goes to Vercel / Cloudflare Pages: root app/web, build `bun run build`, output dist).
services:
  - type: web
    name: nuskha-engine
    runtime: python
    rootDir: app/engine
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn nuskha.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: FILE_STORE
        value: s3   # Render's disk is wiped on deploy: keep originals in R2
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: APP_ENV
        value: production
